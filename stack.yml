name: tempo
title: Grafana Tempo
icon: tempo
docs: https://wodby.com/docs/2.0/stacks/catalog/tempo/

services:
- name: tempo
  title: Grafana Tempo
  service: tempo
  required: true
  volumes:
  - name: data
    size: 20
  workloads:
  - name: main
    containers:
    - name: tempo
      resources:
        request:
          cpu: 200
          memory: 512
        limit:
          cpu: 1000
          memory: 2048
- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  required: true
  links:
  - name: traces
    service: tempo
  workloads:
  - name: main
    containers:
    - name: otelcol
      resources:
        request:
          cpu: 100
          memory: 128
        limit:
          cpu: 500
          memory: 512
- name: grafana
  title: Grafana
  service: grafana
  main: true
  links:
  - name: tempo
    service: tempo
  configs:
  - name: datasources
    config: configs/grafana-datasources.yml.tmpl
  volumes:
  - name: data
    size: 10
  workloads:
  - name: main
    containers:
    - name: grafana
      resources:
        request:
          cpu: 200
          memory: 512
        limit:
          cpu: 1000
          memory: 1024
