name: tempo
title: Grafana Tempo
icon: tempo
docs: https://wodby.com/docs/2.0/stacks/catalog/tempo/

services:
- name: tempo
  title: Grafana Tempo
  service: tempo
  required: true
  volumes:
  - name: data
    size: 20
- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  required: true
  links:
  - name: traces
    service: tempo
- name: grafana
  title: Grafana
  service: grafana
  main: true
  links:
  - name: tempo
    service: tempo
  configs:
  - name: datasources
    config: configs/grafana-datasources.yml.tmpl
  volumes:
  - name: data
    size: 10
